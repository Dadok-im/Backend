name: CI-CD (dadokim blue/green)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

env:
  IMAGE_NAME: dadokim-app
  IMAGE_LATEST_TAG: latest

jobs:
  build_and_push:
    name: Build & Push Docker (multi-arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_LATEST_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Blue/Green Deploy to EC2
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Blue/Green deploy + switch on EC2 (single SSH step)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: IMAGE_NAME,IMAGE_LATEST_TAG
          script: |
            set -euo pipefail

            DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
            REPO="${DOCKERHUB_USER}/${IMAGE_NAME}"
            TAG_LATEST="${IMAGE_LATEST_TAG}"
            SHA_TAG="${{ github.sha }}"
            NGINX="${{ secrets.NGINX_CONTAINER_NAME || 'nginxserver' }}"

            # Docker 권한 확인 (테스트)
            sudo -n docker ps >/dev/null

            # 네트워크 보장
            sudo docker network inspect app_net >/dev/null 2>&1 || sudo docker network create app_net

            # 현재 업스트림 판별
            CURRENT=$(
              sudo docker exec -i "$NGINX" sh -lc \
                "awk -F'[ :;]+' '/set \\$service_url/ {print \$4}' /etc/nginx/conf.d/service-env.inc | sed 's/:.*//'" \
              | tr -d '\r'
            )
            if [ "${CURRENT:-unknown}" = "blue" ]; then
              TARGET="green"; PREV="blue"
            else
              TARGET="blue";  PREV="green"
            fi
            echo "Current=${CURRENT:-none} -> Target=${TARGET} (Prev=${PREV})"

            cd /home/ubuntu

            # compose 파일 이미지 네임스페이스 보정(최초 1회)
            if grep -qE 'image:\s*dadokim-app:latest' "docker-compose-${TARGET}.yml"; then
              sudo sed -i "s#image:\s*dadokim-app:latest#image: ${REPO}:${TAG_LATEST}#g" "docker-compose-${TARGET}.yml"
            fi

            # 이미지 pull
            sudo docker pull "${REPO}:${TAG_LATEST}" || true
            sudo docker pull "${REPO}:${SHA_TAG}"   || true

            # 대상 스택 기동
            sudo docker compose --env-file .env.prod -f "docker-compose-${TARGET}.yml" up -d --no-build

            # 컨테이너 헬스 대기
            echo "Waiting container health: ${TARGET}"
            for i in $(seq 1 120); do
              STATUS="$(sudo docker inspect -f '{{.State.Health.Status}}' ${TARGET} 2>/dev/null || echo 'unknown')"
              [ "$STATUS" = "healthy" ] && { echo "Container is healthy."; break; }
              sleep 2
            done

            # 앱 헬스
            sudo docker exec -i "${TARGET}" sh -lc "apk add --no-cache curl >/dev/null 2>&1 || true"
            for i in $(seq 1 30); do
              if sudo docker exec -i "${TARGET}" sh -lc "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"; then
                echo "App health=UP"; break
              fi
              sleep 2
            done

            # Nginx 전환(+reload) — 포트 포함
            sudo docker exec -i "$NGINX" sh -lc "echo 'set \$service_url http://${TARGET}:8080;' > /etc/nginx/conf.d/service-env.inc && nginx -t && nginx -s reload"
            echo "Switched Nginx to ${TARGET}"

            # 이전 스택 종료(선택)
            sudo docker compose -f "docker-compose-${PREV}.yml" down || true

            # 상태 출력
            sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
      

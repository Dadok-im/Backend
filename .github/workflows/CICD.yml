name: CICD

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Dockerfile이 Gradle/JDK17로 빌드하므로 JDK 17만 설치 (로컬 빌드 X)
      - name: Install JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 서버 compose가 'image: leeminjundocker/dadokim-app:latest'를 사용하므로
      # 레지스트리에 동일 태그로 푸시
      - name: Build Docker
        run: docker build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/dadokim-app:latest .

      - name: Push Docker
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/dadokim-app:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 1) 현재 Nginx가 바라보는 upstream 파악 → 대상/포트 계산 (Runner에서만 GITHUB_ENV 사용)
      - name: Set target IP
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -o /dev/null -w "%{http_code}" "http://${{ secrets.LIVE_SERVER_IP }}/env" || true)
          if [ "${STATUS}" = "200" ]; then
            CURRENT_UPSTREAM=$(curl -s "http://${{ secrets.LIVE_SERVER_IP }}/env")
          else
            # 최초 배포 등 /env 미응답 시 green으로 가정
            CURRENT_UPSTREAM=green
          fi

          echo "CURRENT_UPSTREAM=${CURRENT_UPSTREAM}" >> "$GITHUB_ENV"

          if [ "$CURRENT_UPSTREAM" = "blue" ]; then
            echo "CURRENT_PORT=8080"    >> "$GITHUB_ENV"
            echo "STOPPED_PORT=8081"   >> "$GITHUB_ENV"
            echo "TARGET_UPSTREAM=green" >> "$GITHUB_ENV"
            echo "TARGET_PORT=8081"    >> "$GITHUB_ENV"
          elif [ "$CURRENT_UPSTREAM" = "green" ]; then
            echo "CURRENT_PORT=8081"   >> "$GITHUB_ENV"
            echo "STOPPED_PORT=8080"   >> "$GITHUB_ENV"
            echo "TARGET_UPSTREAM=blue"  >> "$GITHUB_ENV"
            echo "TARGET_PORT=8080"    >> "$GITHUB_ENV"
          else
            echo "Unknown CURRENT_UPSTREAM: ${CURRENT_UPSTREAM}"
            exit 1
          fi

      # 2) 대상 스택 기동 (서버에서 빌드하지 않도록 --no-build 사용, 항상 sudo)
      - name: Docker compose
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.LIVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            # 최신 이미지 pull (레지스트리 기반 배포)
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dadokim-app:latest || true
            # 대상 compose up (서버에 /home/ubuntu/docker-compose-*.yml 존재)
            # compose에 build: 항목이 있어도 서버 빌드를 막기 위해 --no-build 사용
            if [ -f /home/ubuntu/.env.prod ]; then
              sudo docker-compose --env-file /home/ubuntu/.env.prod -f /home/ubuntu/docker-compose-${{ env.TARGET_UPSTREAM }}.yml up -d --no-build
            else
              sudo docker-compose -f /home/ubuntu/docker-compose-${{ env.TARGET_UPSTREAM }}.yml up -d --no-build
            fi

      # 3) 신규 스택 헬스체크: Nginx를 거치지 않고 대상 포트(STOPPED_PORT)의 /env 확인
      - name: Check deploy server URL
        uses: jtalk/url-health-check-action@v3
        with:
          url: http://${{ secrets.LIVE_SERVER_IP }}:${{ env.STOPPED_PORT }}/env
          max-attempts: 6
          retry-delay: 10s

      # 4) Nginx 전환: service-env.inc에는 upstream "이름만" (blue/green) 작성
      #    $service_url 변수 확장 충돌 방지를 위해 quoted heredoc 사용
      - name: Change nginx upstream
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.LIVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            NGINX=nginxserver
            sudo docker exec -i "$NGINX" sh -lc "printf '%s\n' 'set \$service_url ${{ env.TARGET_UPSTREAM }};' > /etc/nginx/conf.d/service-env.inc && nginx -t && nginx -s reload"

      # 5) 이전 컨테이너 종료 (컨테이너 이름이 blue/green)
      - name: Stop current server
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.LIVE_SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            sudo docker stop ${{ env.CURRENT_UPSTREAM }} || true
            sudo docker rm   ${{ env.CURRENT_UPSTREAM }} || true

name: CI-CD (dadokim blue/green)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

env:
  IMAGE_NAME: dadokim-app
  IMAGE_LATEST_TAG: latest

jobs:
  build_and_push:
    name: Build & Push Docker (multi-arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (선택) 리포 루트에 Dockerfile이 없으면 file/context 경로 바꿔주세요
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_LATEST_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Blue/Green Deploy to EC2
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      # 1) 현재 Nginx가 가리키는 색상 읽어서 타깃 결정
      - name: Decide target upstream (blue/green)
        id: decide
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            if sudo test -f /etc/nginx/conf.d/service-env.inc; then
              CUR=$(sudo grep -Eo 'http://(blue|green);' /etc/nginx/conf.d/service-env.inc | sed 's#http://##;s/;//')
            else
              CUR="green"
            fi
            [ -z "$CUR" ] && CUR="green"

            if [ "$CUR" = "blue" ]; then
              echo "CURRENT=blue"  >> $GITHUB_ENV
              echo "TARGET=green"  >> $GITHUB_ENV
              echo "TARGET_PORT=8081" >> $GITHUB_ENV
              echo "CURRENT_PORT=8080" >> $GITHUB_ENV
            else
              echo "CURRENT=green" >> $GITHUB_ENV
              echo "TARGET=blue"   >> $GITHUB_ENV
              echo "TARGET_PORT=8080" >> $GITHUB_ENV
              echo "CURRENT_PORT=8081" >> $GITHUB_ENV
            fi

      # 2) 대상 색상 compose up (이미지 최신으로 교체, 빌드 금지)
      - name: Deploy target stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DOCKERHUB_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
            TARGET="${{ env.TARGET }}"
            TAG_LATEST="${{ env.IMAGE_LATEST_TAG }}"
            SHA_TAG="${{ github.sha }}"

            cd /home/ubuntu

            # compose 파일 안 image 라인이 네임스페이스 없이 있다면 자동 치환 (최초 1회용)
            if grep -qE 'image:\s*dadokim-app:latest' "docker-compose-${TARGET}.yml"; then
              sudo sed -i "s#image:\s*dadokim-app:latest#image: ${DOCKERHUB_REPO}:${TAG_LATEST}#g" "docker-compose-${TARGET}.yml"
            fi

            # 최신 이미지 당겨오기 (latest 우선, SHA도 함께)
            sudo docker pull "${DOCKERHUB_REPO}:${TAG_LATEST}" || true
            sudo docker pull "${DOCKERHUB_REPO}:${SHA_TAG}"   || true

            # env 파일 치환용 + 컨테이너 env 주입용 둘 다 대비해서 --env-file 사용 권장
            sudo docker compose --env-file .env.prod -f "docker-compose-${TARGET}.yml" up -d --no-build

      # 3) 신규 스택 헬스체크 (/healthcheck 사용)
      - name: Health check new stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            TARGET="${{ env.TARGET }}"
            PORT="${{ env.TARGET_PORT }}"

            # 최대 60초(30회) 재시도
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT}/healthcheck" | grep -q "\"env\":\"${TARGET}\""; then
                echo "Health OK on ${PORT} (env=${TARGET})"
                exit 0
              fi
              sleep 2
            done

            echo "Health check FAILED on ${PORT}"
            sudo docker logs --tail=200 "${TARGET}" || true
            exit 1

      # 4) Nginx 전환 (변수 파일에 스킴+세미콜론 필수)
      - name: Switch Nginx upstream to target
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            TARGET="${{ env.TARGET }}"
            NGINX="${{ secrets.NGINX_CONTAINER_NAME || 'nginxserver' }}"

            sudo docker exec -i "$NGINX" bash -lc \"echo 'set \$service_url ${TARGET};' > /etc/nginx/conf.d/service-env.inc && nginx -t && nginx -s reload"
      # 5) 이전 색상 종료
      - name: Stop old stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            CURRENT="${{ env.CURRENT }}"
            sudo docker rm -f "${CURRENT}" || true

name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dadokim-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 굳이 로컬 빌드(JDK) 안 써도 되지만, Docker 빌드가 Gradle을 내부에서 쓰면 17로 맞춤
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker (latest + sha)
        run: |
          set -euo pipefail
          GIT_SHA="${GITHUB_SHA::7}"
          docker build --platform linux/amd64 -t "${IMAGE_NAME}:latest" -t "${IMAGE_NAME}:${GIT_SHA}" .
      - name: Push Docker
        run: |
          set -euo pipefail
          GIT_SHA="${GITHUB_SHA::7}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GIT_SHA}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 0) 현재 Nginx가 바라보는 upstream을 서버에서 직접 확인 (service-env.inc 파싱)
      - name: Read current upstream from Nginx
        id: get_upstream
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          capture_stdout: true
          script: |
            set -euo pipefail
            NGINX="${{ secrets.NGINX_CONTAINER_NAME || 'nginxserver' }}"
            if ! docker ps --format '{{.Names}}' | grep -q "^${NGINX}$"; then
              echo "unknown"
              exit 0
            fi
            docker exec "${NGINX}" sh -lc "awk '/set \\\$service_url/ {print \$3}' /etc/nginx/conf.d/service-env.inc | sed -e 's#http://##' -e 's/;//'"

      - name: Decide target/ports
        id: setenv
        shell: bash
        run: |
          set -euo pipefail
          CUR="${{ steps.get_upstream.outputs.stdout }}"
          if [[ "$CUR" != "blue" && "$CUR" != "green" ]]; then
            CUR="green"  # 초기 배포 등 파싱 실패 시 green 가정
          fi
          if [[ "$CUR" == "blue" ]]; then
            echo "CURRENT_UPSTREAM=blue"  >> "$GITHUB_ENV"
            echo "CURRENT_PORT=8080"     >> "$GITHUB_ENV"
            echo "TARGET_UPSTREAM=green" >> "$GITHUB_ENV"
            echo "TARGET_PORT=8081"      >> "$GITHUB_ENV"
          else
            echo "CURRENT_UPSTREAM=green" >> "$GITHUB_ENV"
            echo "CURRENT_PORT=8081"      >> "$GITHUB_ENV"
            echo "TARGET_UPSTREAM=blue"   >> "$GITHUB_ENV"
            echo "TARGET_PORT=8080"       >> "$GITHUB_ENV"
          fi
          # 호환성: 기존 변수명도 세팅
          echo "STOPPED_PORT=${TARGET_PORT:-8081}" >> "$GITHUB_ENV"

      # 1) 대상 스택 이미지 pull + compose up (서버 빌드 금지)
      - name: Start target stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # 1) compose 커맨드 자동 선택 (v2 우선)
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            # 2) 타임아웃 넉넉히 (클라이언트/compose 모두)
            export DOCKER_CLIENT_TIMEOUT=300
            export COMPOSE_HTTP_TIMEOUT=300

            TGT="${{ env.TARGET_UPSTREAM }}"
            IMG="${{ env.IMAGE_NAME }}"

            # 3) 최신 이미지 pull
            sudo docker pull "${IMG}:latest" || true

            # 4) compose up (sudo에 환경변수 전달: -E 또는 env 앞에 붙이기)
            if [ -f /home/ubuntu/.env.prod ]; then
              # sudo에 환경변수를 보존(-E) + 명시적 env 보강
              sudo -E env DOCKER_CLIENT_TIMEOUT="$DOCKER_CLIENT_TIMEOUT" COMPOSE_HTTP_TIMEOUT="$COMPOSE_HTTP_TIMEOUT" \
                $COMPOSE_CMD --env-file /home/ubuntu/.env.prod -f "/home/ubuntu/docker-compose-${TGT}.yml" up -d --no-build
            else
              sudo -E env DOCKER_CLIENT_TIMEOUT="$DOCKER_CLIENT_TIMEOUT" COMPOSE_HTTP_TIMEOUT="$COMPOSE_HTTP_TIMEOUT" \
                $COMPOSE_CMD -f "/home/ubuntu/docker-compose-${TGT}.yml" up -d --no-build
            fi

            # 5) 상태 출력
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      

      # 2) 신규 스택 "서버 내부 localhost"로 헬스체크
      - name: Local healthcheck on target
        id: local_hc
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            PORT="${{ env.TARGET_PORT }}"
            PATHS=("/healthcheck" "/actuator/health" "/env" "/")
            for i in {1..60}; do  # 최대 5분
              for p in "${PATHS[@]}"; do
                if curl -fsS "http://127.0.0.1:${PORT}${p}" >/dev/null 2>&1; then
                  echo "Healthy on ${PORT}${p}"
                  exit 0
                fi
              done
              sleep 5
            done
            echo "Healthcheck failed on :${PORT}" >&2
            echo "==== listeners (host) ====" >&2
            sudo ss -ltnp | grep ":${PORT}\b" || true
            echo "==== docker ps ====" >&2
            sudo docker ps >&2 || true
            echo "==== target logs (tail) ====" >&2
            sudo docker logs --tail=300 "${{ env.TARGET_UPSTREAM }}" >&2 || true
            exit 1

        # 2-1) 실패 시 새 컨테이너 정리 (CPU 튐 방지)
      - name: Cleanup target on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo docker stop "${{ env.TARGET_UPSTREAM }}" || true
            sudo docker rm   "${{ env.TARGET_UPSTREAM }}" || true

      # 3) Nginx 전환 (변수 파일에 스킴+세미콜론 필수)
      - name: Switch Nginx upstream to target
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            NGINX="${{ secrets.NGINX_CONTAINER_NAME || 'nginxserver' }}"
            # set $service_url http://blue; 또는 http://green;
            sudo docker exec -i "$NGINX" sh -lc "printf '%s\n' 'set \$service_url http://${{ env.TARGET_UPSTREAM }};' > /etc/nginx/conf.d/service-env.inc && nginx -t && nginx -s reload"

      # 4) 이전 컨테이너 종료
      - name: Stop old container
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo docker stop "${{ env.CURRENT_UPSTREAM }}" || true
            sudo docker rm   "${{ env.CURRENT_UPSTREAM }}" || true

      # 5) 외부(80/443)로 최종 헬스체크 (선택)
      - name: Public health check via Nginx
        uses: jtalk/url-health-check-action@v3
        with:
          url: http://${{ secrets.LIVE_SERVER_IP }}/healthcheck
          max-attempts: 12
          retry-delay: 5s

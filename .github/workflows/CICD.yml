name: CICD

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dadokim-app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker (latest + sha)
        run: |
          set -euo pipefail
          GIT_SHA="${GITHUB_SHA::7}"
          docker build --platform linux/amd64 -t "${IMAGE_NAME}:latest" -t "${IMAGE_NAME}:${GIT_SHA}" .

      - name: Push Docker
        run: |
          set -euo pipefail
          GIT_SHA="${GITHUB_SHA::7}"
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GIT_SHA}"

      - name: Export image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ─────────────────────────────────────────────────────────────
      # 0) 대상 업스트림 계산을 원격에서 자체 수행 (출력 전달 의존 X)
      # ─────────────────────────────────────────────────────────────
      - name: Decide target upstream (SSH)
        id: decide
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            NGINX="${{ secrets.NGINX_CONTAINER_NAME || 'nginxserver' }}"
            # service-env.inc 에서 현재 값 읽기 (예: 'blue' 또는 'green')
            CUR=$(sudo docker exec "$NGINX" sh -lc "awk '/set \\\$service_url/ {print \$3}' /etc/nginx/conf.d/service-env.inc" \
                  | sed -e 's/;//')
            [ "$CUR" = "blue" ] || [ "$CUR" = "green" ] || CUR="green"
            if [ "$CUR" = "blue" ]; then
              echo "CURRENT=blue"
              echo "TARGET=green"
              echo "TARGET_PORT=8081"
            else
              echo "CURRENT=green"
              echo "TARGET=blue"
              echo "TARGET_PORT=8080"
            fi

      # GitHub runner 환경변수로 반영 (로깅된 문자열을 파싱) .
      - name: Capture decide outputs
        shell: bash
        run: |
          set -euo pipefail
          # 위 step 출력에서 CURRENT/TARGET/TARGET_PORT 라인을 파싱
          LOG="${{ steps.decide.outputs.stdout }}"
          CUR=$(printf "%s" "$LOG" | sed -n 's/^CURRENT=\(.*\)$/\1/p' | tail -n1)
          TGT=$(printf "%s" "$LOG" | sed -n 's/^TARGET=\(.*\)$/\1/p' | tail -n1)
          PORT=$(printf "%s" "$LOG" | sed -n 's/^TARGET_PORT=\(.*\)$/\1/p' | tail -n1)
          echo "CURRENT_UPSTREAM=${CUR:-green}" >> "$GITHUB_ENV"
          echo "TARGET_UPSTREAM=${TGT:-blue}"   >> "$GITHUB_ENV"
          echo "TARGET_PORT=${PORT:-8080}"      >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────
      # 1) 대상 스택 기동 (리소스 상한 + 깔끔한 재기동)
      # ─────────────────────────────────────────────────────────────
      - name: Start target stack (resource-capped)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi
            export DOCKER_CLIENT_TIMEOUT=300
            export COMPOSE_HTTP_TIMEOUT=300

            TGT="${{ env.TARGET_UPSTREAM }}"
            IMG="${{ env.IMAGE_NAME }}"
            TAG="${{ env.IMAGE_TAG }}"
            COMPOSE_FILE="/home/ubuntu/docker-compose-${TGT}.yml"
            ENV_FILE="/home/ubuntu/.env.prod"

            # 0) 이미지 최신화(sha 태그 우선, 없으면 latest)
            sudo docker pull "${IMG}:${TAG}" || true
            sudo docker tag  "${IMG}:${TAG}" "${IMG}:latest" || true

            # 1) 기존 대상 컨테이너 정리 (재생성 멈춤 방지)
            if sudo docker ps -a --format '{{.Names}}' | grep -qx "${TGT}"; then
              sudo docker stop -t 8 "${TGT}" || sudo docker kill "${TGT}" || true
              sudo docker rm -f   "${TGT}" || true
            fi

            # 2) orphan 정리 + 빌드 금지
            if [ -f "$ENV_FILE" ]; then
              sudo -E env DOCKER_CLIENT_TIMEOUT="$DOCKER_CLIENT_TIMEOUT" COMPOSE_HTTP_TIMEOUT="$COMPOSE_HTTP_TIMEOUT" \
                $COMPOSE_CMD --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build --remove-orphans
            else
              $COMPOSE_CMD -f "$COMPOSE_FILE" up -d --no-build --remove-orphans
            fi

            # 3) 리소스 상한 (CPU/메모리 캡으로 스파이크 억제)
            #    Compose의 deploy.resources는 non-swarm에선 무시되므로 runtime update 사용
            sudo docker update --cpus="1.0" --memory="1024m" "${TGT}" || true

            # (선택) JVM도 코어 제한 적용: 컨테이너에 JAVA_TOOL_OPTIONS 주입을 권장
            # -XX:ActiveProcessorCount=1 -XX:MaxRAMPercentage=65.0

            # 4) 상태 출력
            sudo docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      # ─────────────────────────────────────────────────────────────
      # 2) 서버 내부에서 가벼운 헬스체크 (최대 90초)
      # ─────────────────────────────────────────────────────────────
      - name: Local healthcheck on target
        id: local_hc
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            PORT="${{ env.TARGET_PORT }}"
            # 가장 가벼운 엔드포인트 우선 (가능하면 /healthcheck → 200 OK)
            PATHS=("/healthcheck" "/actuator/health" "/")
            for i in $(seq 1 30); do  # 최대 30 * 3s = 90s
              for p in "${PATHS[@]}"; do
                if curl -fsS "http://127.0.0.1:${PORT}${p}" >/dev/null 2>&1; then
                  echo "Healthy on ${PORT}${p}"
                  exit 0
                fi
              done
              sleep 3
            done
            echo "Healthcheck failed on :${PORT}" >&2
            echo "==== listeners (host) ====" >&2
            sudo ss -ltnp | grep ":${PORT}\b" || true
            echo "==== docker ps ====" >&2
            sudo docker ps >&2 || true
            echo "==== target logs (tail) ====" >&2
            sudo docker logs --tail=300 "${{ env.TARGET_UPSTREAM }}" >&2 || true
            exit 1

      # 실패 시 깔끔 정리 (CPU 튐 방지)
      - name: Cleanup target on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo docker stop "${{ env.TARGET_UPSTREAM }}" || true
            sudo docker rm   "${{ env.TARGET_UPSTREAM }}" || true

      # ─────────────────────────────────────────────────────────────
      # 3) Nginx 전환 (현재 설정과 동일 스타일: upstream 이름을 변수에 설정)
      # ─────────────────────────────────────────────────────────────
      - name: Switch Nginx upstream to target
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            NGINX="${{ secrets.NGINX_CONTAINER_NAME || 'nginxserver' }}"
            TGT="${{ env.TARGET_UPSTREAM }}"
            sudo docker exec -i "$NGINX" sh -lc "printf 'set \$service_url %s;\n' \"$TGT\" > /etc/nginx/conf.d/service-env.inc && nginx -t && nginx -s reload"

      # ─────────────────────────────────────────────────────────────
      # 4) 이전 컨테이너는 리소스 안정 후 정리 (바로 kill하지 않음)
      # ─────────────────────────────────────────────────────────────
      - name: Stop old container (after switch)
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIVE_SERVER_IP }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            OLD="${{ env.CURRENT_UPSTREAM || 'blue' }}"
            # 즉시 kill 대신 짧게 graceful
            sudo docker stop -t 5 "$OLD" || true
            sudo docker rm -f "$OLD" || true

      # ─────────────────────────────────────────────────────────────
      # 5) 외부(80) 최종 헬스체크
      # ─────────────────────────────────────────────────────────────
      - name: Public health check via Nginx
        uses: jtalk/url-health-check-action@v3
        with:
          url: http://${{ secrets.LIVE_SERVER_IP }}/healthcheck
          max-attempts: 10
          retry-delay: 3s
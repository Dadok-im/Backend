# =========================================
# application.yml (최종본)
# - 기본 프로필: local  (IntelliJ에서 아무 설정 없이 실행 ⇒ local+common)
# - Docker(dev): SPRING_PROFILES_ACTIVE=dev ⇒ dev+common
# - blue/green: 배포용 프로필
# =========================================
spring:
  profiles:
    default: local
    group:
      local: local,common
      dev: dev,common
      blue: blue,common
      green: green,common

---
# =============== 공통 설정 ===============
spring:
  config:
    activate:
      on-profile: common

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}

geminiapi:
  key: ${GEMINI_API_KEY}

chatkey: ${GPT_API_KEY}

kakao:
  rest-api-key: ${KAKAO_API_KEY}

clova:
  ocr:
    url: ${CLOVA_OCR_URL}
    secret: ${CLOVA_OCR_SECRET}

logging:
  level:
    root: INFO
    com.ayu.dadokim: DEBUG

server:
  port: 8080

---
# =============== 로컬(local): IntelliJ 실행, 로컬 PC MySQL 사용 ===============
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/dadokim
    username: ${USER_NAME}
    password: ${USER_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          naver:
            # 로컬 포트 명시
            redirect-uri: http://localhost:8080/login/oauth2/code/naver

server:
  port: 8080
  address: localhost
  env: local

serverName: local_server

---
# =============== 개발(dev): Docker 실행, 컨테이너 MySQL(db) 사용 ===============
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://db:3306/dadokim
    username: ${USER_NAME}
    password: ${USER_PASSWORD}
    hikari:
      initializationFailTimeout: 0
      connectionTimeout: 30000
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          naver:
            # 호스트에서 8080으로 프록시/포워딩한다면 다음처럼
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            # 또는 더 안전하게 {baseUrl} 사용 가능:
            # redirect-uri: "{baseUrl}/login/oauth2/code/naver"

server:
  port: 8080
  address: localhost
  env: dev

serverName: dev_server

---
# =============== blue (배포) ===============
spring:
  config:
    activate:
      on-profile: blue
  security:
    oauth2:
      client:
        registration:
          naver:
            redirect-uri: https://dadokim.o-r.kr/login/oauth2/code/naver

server:
  port: 8080
  address: 0.0.0.0
  env: blue

serverName: blue_server

---
# =============== green (배포) ===============
spring:
  config:
    activate:
      on-profile: green
  security:
    oauth2:
      client:
        registration:
          naver:
            redirect-uri: https://dadokim.o-r.kr/login/oauth2/code/naver

server:
  port: 8081
  address: 0.0.0.0
  env: green

serverName: green_server



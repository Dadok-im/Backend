spring:
  profiles:
    active: local
    group:
      local: local, common
      blue: blue, common
      green: green, common

server:
  env: blue

---

## local 서버 실행 환경
spring:
  config:
    activate:
      on-profile: local
  security:
    oauth2:
      client:
        registration:
          naver:
            redirect-uri: http://localhost/login/oauth2/code/naver

server:
  port: 8080
  serverAddress: localhost

serverName: local_server

---

